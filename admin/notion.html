    <link rel="stylesheet" href="/s.css" />
    <style>
        body.hidden {
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>
  </head>
  <body class="hidden">
    <div class="系統外框">
      <aside class="側邊欄" aria-label="系統導覽">
        <div class="品牌標誌組">
          <div><strong>雙鏡頭熱成像跌倒偵測</strong><small>系統監控</small></div>
        </div>
        <nav class="導覽清單" aria-label="系統頁面">
          <a class="導覽項目" href="page.html"><span class="導覽圖示" aria-hidden="true">▣</span><span>即時監測</span></a>
          <a class="導覽項目" href="events.html"><span class="導覽圖示" aria-hidden="true">☷</span><span>事件紀錄</span></a>
          <a class="導覽項目" href="analytics.html"><span class="導覽圖示" aria-hidden="true">⌁</span><span>統計分析</span></a>
          <a class="導覽項目 目前選取" href="notion.html" aria-current="page"><span class="導覽圖示" aria-hidden="true">♢</span><span>通知管道</span></a>
          <a class="導覽項目" href="users.html"><span class="導覽圖示" aria-hidden="true">♙</span><span>使用者管理</span></a>
        </nav>
        <div class="側邊欄說明"><span aria-hidden="true">✦</span><strong>安心守護每一天</strong><p>監測狀態一覽無遺</p></div>
      </aside>
      <main class="主要內容">
        <header class="頂部工具列">
          <a href="/index.html">
            <button class="登出" type="button">登出</button>
          </a>
          <div class="導覽"><span>雙鏡頭熱成像跌倒偵測</span><span aria-hidden="true">/</span><strong>通知管道</strong></div>
          <span class="連線狀態"><i aria-hidden="true"></i>系統連線正常</span>
        </header>
        <div class="內容捲動區">
          <div class="頁面容器">
            <section aria-label="通知管道">
              <div class="頁面標題區">
                <div>
                  <p class="頁首小標">即時照護</p>
                  <h1>通知<span>管道</span></h1>
                </div>
              </div>
              <div class="通知設定版面">
                <section class="通知設定面板" aria-labelledby="通知對象標題">
                  <h2 id="通知對象標題">通知對象</h2>
                  <p class="通知面板說明">選擇接收照護通知的成員</p>
                  <label class="通知對象選項">
                    <span class="勾選方框"><input type="checkbox" checked /><span aria-hidden="true"></span></span>
                    <span class="通知對象文字"><strong>家屬</strong><small>接收照護與安全提醒</small></span>
                  </label>
                  <label class="通知對象選項">
                    <span class="勾選方框"><input type="checkbox" checked /><span aria-hidden="true"></span></span>
                    <span class="通知對象文字"><strong>管理者</strong><small>接收系統與設備通知</small></span>
                  </label>
                </section>

                <section class="通知設定面板" aria-labelledby="通知管道標題">
                  <h2 id="通知管道標題">通知管道</h2>
                  <p class="通知面板說明">選擇要使用的訊息方式</p>
                  <label class="通知管道選項">
                    <span class="通知方式圖示 簡訊圖示" aria-hidden="true">▤</span>
                    <span class="通知管道文字"><strong>簡訊 (SMS)</strong><small>傳送至已登記手機</small></span>
                    <span class="切換開關"><input type="checkbox" checked /><span aria-hidden="true"></span></span>
                  </label>
                  <label class="通知管道選項">
                    <span class="通知方式圖示 郵件圖示" aria-hidden="true">✉</span>
                    <span class="通知管道文字"><strong>Email</strong><small>寄送事件與狀態摘要</small></span>
                    <span class="切換開關"><input type="checkbox" checked /><span aria-hidden="true"></span></span>
                  </label>
                  <label class="通知管道選項">
                    <span class="通知方式圖示 訊息圖示" aria-hidden="true">☏</span>
                    <span class="通知管道文字"><strong>LINE</strong><small>傳送即時事件提醒</small></span>
                    <span class="切換開關"><input type="checkbox" checked /><span aria-hidden="true"></span></span>
                  </label>
                </section>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
  <script>
    if (sessionStorage.getItem('login') === 'admin') {
      document.body.classList.remove('hidden');
    }else if (sessionStorage.getItem('login') !== 'admin') {
      alert('請先登入系統！');
      window.location.href = '/index.html';
    }
  </script>
